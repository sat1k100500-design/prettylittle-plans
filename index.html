<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>PRETTYLITTLE PLANS</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Паперовий планер: вкладки місяців угорі, розділи внизу (телефон) або меню зліва (широкий екран). Свідомо одна світла тема, як у PDF. */
:root{
  --paper:#faf6f1; --card:#fffdfa; --blush:#f9e6ec; --sand:#f2ebe1; --line:#e2d3c8;
  --rose:#e9acc1; --rose-ink:#c9809b; --wine:#5e0c2e; --ink:#3c0e18; --muted:#8a6d70; --faint:#c4b2ae;
  --f-display:"Jost","Helvetica Neue",Arial,sans-serif;
  --f-script:"Great Vibes","Segoe Script",cursive;
  --f-body:"Manrope","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);min-height:100%}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;padding:0;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* каркас */
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:none}
.content{flex:1;width:100%;max-width:760px;margin:0 auto;padding-bottom:84px}
.months{display:grid;grid-template-columns:repeat(12,1fr);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.months button{border:0;padding:9px 0;font-size:9.5px;letter-spacing:.06em;font-weight:600;background:var(--sand);color:var(--ink);border-right:1px solid var(--paper)}
.months button:nth-child(odd){background:#f3dbe3}
.months button[aria-current="true"]{background:var(--wine);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sand);z-index:10}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--sand);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{border:0;background:transparent;padding:14px 0;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink);border-right:1px solid var(--paper)}
.tabbar button[aria-current="page"]{background:var(--wine);color:#fff}

/* заголовок сторінки */
.page-head{padding-block:18px 4px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head .tt{min-width:0;flex:1}
.page-title{font-family:var(--f-display);font-weight:300;font-size:clamp(32px,9vw,54px);line-height:1;letter-spacing:.04em;text-transform:uppercase;color:var(--rose);margin:0;text-wrap:balance}
.page-sub{font-family:var(--f-script);font-size:24px;color:var(--ink);margin-top:2px}
.arrows{display:flex;gap:6px}
.arrows button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--wine)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-block:8px 2px}
.tab{border:1px solid var(--line);background:var(--card);padding:6px 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border-radius:3px}
.tab[aria-pressed="true"]{background:var(--rose);border-color:var(--rose)}
.tab.today{box-shadow:inset 0 -2px 0 var(--wine)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-block:8px 2px}
.days7 .tab{padding:6px 0;text-align:center;font-size:9.5px}

/* блоки */
.body{display:grid;gap:10px;padding-block:10px 18px}
.grid2,.grid3,.split{display:grid;gap:10px}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.box{background:var(--card);border:1px solid var(--line);padding:11px 12px 12px;min-width:0}
.box.pink{background:var(--blush);border-color:transparent}
.box.sand{background:var(--sand);border-color:transparent}
.lbl{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.lbl::before{content:"";width:6px;height:6px;background:var(--rose);flex:none}
.box.pink .lbl::before{background:var(--wine)}
.lbl .aside{margin-left:auto;letter-spacing:.04em;font-weight:500;text-transform:none;color:var(--muted)}
.lbl a,.lbl button.link{margin-left:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ln{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;font-size:14px;border-radius:0}
.ln::placeholder,textarea::placeholder{color:var(--faint)}
.ln:focus{outline:none;border-bottom-color:var(--rose-ink)}
textarea.area{width:100%;min-height:90px;border:1px solid var(--line);background:var(--card);padding:8px;resize:vertical;font-size:14px;line-height:1.5}
.sched{display:grid;grid-template-columns:46px 1fr;align-items:end;column-gap:6px}
.sched span{font-size:11px;color:var(--muted);padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-script);font-size:21px;color:var(--wine);width:20px;line-height:1}
.prio{display:grid;grid-template-columns:20px 1fr;align-items:end;gap:6px}
.item{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:2px 0;min-height:36px}
.item.noc{grid-template-columns:1fr auto}
.chk{appearance:none;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:2px;margin:0;display:grid;place-items:center;background:var(--card);cursor:pointer}
.chk:checked{background:var(--wine);border-color:var(--wine)}
.chk:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.item .t{border:0;background:transparent;padding:6px 0;font-size:14px;width:100%;min-width:0}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:3px}
.x:hover{color:var(--wine)}
.x.armed{color:#fff;background:var(--wine);font-size:11px;letter-spacing:.06em}
.add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.add > *{flex:1 1 120px;min-width:0}
.add .btn{flex:0 0 auto}
.btn{border:1px solid var(--wine);background:var(--wine);color:#fff;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border-radius:3px;font-weight:600}
.btn.ghost{background:transparent;color:var(--wine)}
.btn.small{padding:5px 8px;font-size:10px}
.field{border:1px solid var(--line);background:var(--card);padding:8px;border-radius:3px;width:100%;min-width:0;font-size:14px}
.drops{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;justify-items:center}
.drop{border:0;background:none;padding:0;width:26px;height:32px}
.drop svg{width:100%;height:100%}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.mood{border:0;background:none;padding:2px;display:grid;justify-items:center;gap:4px;font-size:10px;color:var(--muted)}
.face{width:34px;height:34px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
.face svg{width:20px;height:20px}
.mood[aria-pressed="true"] .face{border-color:var(--wine)}
.mood[aria-pressed="true"]{color:var(--ink);font-weight:700}
.stars{display:flex;gap:4px}
.star{border:0;background:none;padding:0;font-size:20px;color:#dcc6c3;line-height:1}
.star.on{color:var(--rose-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:end;font-size:11px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.empty{font-size:12.5px;color:var(--muted);padding:8px 0}
.link{border:0;background:none;color:var(--rose-ink);text-decoration:underline;padding:0;font-size:12px}
.chipv{font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--sand);color:var(--muted);white-space:nowrap}

/* головна */
.hello{font-family:var(--f-script);font-size:30px;color:var(--wine);line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--card);padding:12px;text-align:left;display:grid;gap:3px}
.tile b{font-family:var(--f-display);font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.tile span{font-size:11.5px;color:var(--muted)}
.tile.pink{background:var(--blush);border-color:transparent}
.affq{font-family:var(--f-script);font-size:26px;line-height:1.25;color:var(--wine);text-align:center;padding:6px 4px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-weight:300;font-size:26px;color:var(--wine);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* місяць */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:9px;letter-spacing:.14em;text-align:center;color:var(--muted);font-weight:700}
.cday{border:1px solid var(--line);background:var(--card);min-height:58px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px}
.cday .d{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cday .m{width:9px;height:9px;border-radius:50%}
.cday .tc{font-size:9.5px;color:var(--muted);margin-top:auto}
.cday.today{border-color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine)}
.cday.out{visibility:hidden}
.weeks{display:grid;gap:6px}
.wk{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card);padding:10px 12px;text-align:left}
.wk b{font-family:var(--f-display);font-weight:400;letter-spacing:.14em;text-transform:uppercase}

/* тиждень */
.wgrid{display:grid;grid-template-columns:1fr;gap:10px}
.wday .lbl{cursor:pointer}
.wday .date{font-family:var(--f-script);font-size:19px;color:var(--rose-ink);letter-spacing:0;text-transform:none;margin-left:auto}

/* фінанси */
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:5px 2px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl input{width:78px;border:0;background:transparent;text-align:right;font-variant-numeric:tabular-nums;padding:3px}
.tbl tr.total td{font-weight:700;border-bottom:0}
.bar{height:4px;background:var(--sand);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose)}
.bar i.over{background:var(--wine)}
.exp{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.exp .m{font-weight:600}
.exp .c{grid-column:1/2;font-size:11.5px;color:var(--muted)}
.exp .a{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.exp .x{grid-row:1/3;grid-column:3}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.form .full{grid-column:1/-1}
.balance{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.balance div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.balance b{font-variant-numeric:tabular-nums}
.balance .neg b{color:var(--wine)}
.piggy{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.coin{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--rose-ink);background:transparent;padding:0;max-width:100%}
.coin.on{background:var(--rose-ink)}
.money{display:grid;grid-template-columns:1fr 92px auto;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:2px 0}
.money input{border:0;background:transparent;padding:6px 2px;min-width:0}
.money input.n{text-align:right;font-variant-numeric:tabular-nums}

/* цілі */
.goal{display:grid;gap:6px}
.goal .top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.goal .title{font-family:var(--f-display);font-size:18px;font-weight:400;border:0;background:transparent;border-bottom:1px solid var(--line);padding:4px 0;width:100%;min-width:0}
.goal .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.goal .meta select,.goal .meta input{border:1px solid var(--line);background:var(--card);padding:3px 6px;border-radius:3px;font-size:12px}
.prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.prog .bar{flex:1;height:6px;margin:0}
.wish{display:grid;grid-template-columns:24px 1fr 86px auto;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:2px 0}
.wish input.t,.wish input.n{border:0;background:transparent;padding:6px 2px;min-width:0}
.wish input.n{text-align:right;font-variant-numeric:tabular-nums}
.wish.done input.t{text-decoration:line-through;color:var(--muted)}

/* нотатки */
.notes{display:grid;gap:8px}
.note{border:1px solid var(--line);background:var(--card);padding:10px 12px;text-align:left;display:grid;gap:3px}
.note b{font-weight:700}
.note span{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note small{font-size:10.5px;color:var(--faint)}
.editor input.title{font-family:var(--f-display);font-size:22px;font-weight:400;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;padding:6px 0}
.editor textarea{min-height:46vh}

/* трекери */
.hgrid-wrap{overflow-x:auto}
.hgrid{border-collapse:collapse;font-size:11px}
.hgrid th{font-weight:500;color:var(--muted);font-size:9px;padding:2px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.hgrid th.h{min-width:150px;text-align:left;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.hgrid td{border:1px solid var(--line);padding:0;text-align:center}
.hgrid td.h{border:0;border-bottom:1px solid var(--line);padding:2px 6px 2px 0;text-align:left;white-space:nowrap}
.hgrid td.h input{border:0;background:transparent;font-size:12.5px;width:110px;padding:4px 0}
.hgrid td.h small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:10px}
.cell{width:22px;height:26px;border:0;background:transparent;padding:0;display:block}
.cell.on{background:var(--rose)}
.hgrid td.today{outline:1.5px solid var(--wine);outline-offset:-1px}
.moodcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:360px}
.mc{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;color:var(--muted);background:var(--card);padding:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}

.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok i{background:#7fa58a}.status.saving i{background:var(--rose-ink)}.status.local i{background:#d0a65a}
.foot{padding-block:10px 4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- широкий екран: сайт ---------- */
@media (min-width:900px){
  .app{flex-direction:row}
  .side{display:flex;flex-direction:column;gap:18px;width:240px;flex:none;background:var(--sand);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .tabbar{display:none}
  .content{max-width:1180px;padding-bottom:32px}
  .gut{padding-left:32px;padding-right:32px}
  .logo{font-family:var(--f-display);font-weight:300;letter-spacing:.16em;line-height:1.05}
  .logo b{display:block;font-size:13px;font-weight:500}
  .logo span{display:block;font-size:36px;color:var(--rose)}
  .logo em{font-family:var(--f-script);font-style:normal;font-size:20px;letter-spacing:0;color:var(--muted)}
  .side nav{display:grid;gap:3px}
  .side nav button{border:0;background:none;text-align:left;padding:9px 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;border-radius:3px}
  .side nav button[aria-current="page"]{background:var(--wine);color:#fff}
  .mini{background:var(--card);border:1px solid var(--line);padding:10px}
  .mini .ttl{font-family:var(--f-script);font-size:21px;text-align:center;margin-bottom:4px}
  .mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px}
  .mini .g b{font-size:8.5px;color:var(--muted)}
  .mini .g button{border:0;background:none;padding:4px 0;border-radius:50%;font-variant-numeric:tabular-nums}
  .mini .g button.sel{background:var(--wine);color:#fff}
  .mini .g button.today:not(.sel){color:var(--rose-ink);font-weight:800}
  .side .status{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
  .foot{display:none}
  .grid2{grid-template-columns:1fr 1fr;align-items:start}
  .grid3{grid-template-columns:1.05fr 1fr 1fr;align-items:start}
  .split{grid-template-columns:1.3fr 1fr;align-items:start}
  .wgrid{grid-template-columns:repeat(4,1fr)}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .cday{min-height:92px}
  .notes{grid-template-columns:repeat(3,1fr)}
}
/* ---------- ГОЛОВНА: книга-планер у 3D ---------- */
.content.bookmode{max-width:none;padding:0;margin:0}
.content.bookmode .foot{display:none}
.stage{position:relative;height:calc(100vh - 50px - env(safe-area-inset-bottom,0px));min-height:560px;overflow:hidden;perspective:2200px;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,#fdf9f5 0%,#f1e8de 62%,#e6dacd 100%)}
@media (min-width:900px){.stage{height:100vh}}
.hintline{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.06em;color:var(--muted);padding:0 16px;pointer-events:none;line-height:1.6}
.scene{position:absolute;left:50%;top:45%;width:0;height:0;transform-origin:0 0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.33,.7,.25,1);will-change:transform}
.cover{will-change:transform}
/* 3D-модель (WebGL) поверх сцени, поки книга закрита */
.gl3d{position:absolute;inset:0;z-index:3;opacity:0;transition:opacity .45s ease;touch-action:none;cursor:grab}
.gl3d canvas{display:block;width:100%;height:100%}
.stage.gl .gl3d{opacity:1}
.stage.gl .scene{opacity:0;pointer-events:none;transition:opacity .3s}
.glfade{position:absolute;z-index:8;pointer-events:none;transition:opacity .5s ease}

.pop{position:absolute;left:8%;right:8%;bottom:6%;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 30px -14px rgba(60,14,24,.5);padding:10px;z-index:6;display:grid;gap:8px;font-size:13px}

/* телефон: після анімації розворот стає пласкою сторінкою (iOS погано натискає в 3D) */
.flatwrap{position:absolute;left:0;right:0;top:45%;transform:translateY(-50%);display:flex;justify-content:center;padding-right:26px}
.pgflat{position:relative;width:var(--W);height:var(--H);background:var(--paper);border-radius:6px;box-shadow:0 18px 40px -22px rgba(60,14,24,.5),0 0 0 1px #e9dfd3;touch-action:pan-y}

@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.flatrings{position:absolute;left:-7px;top:7%;bottom:7%;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.flatrings i{width:16px;height:9px;border:2.5px solid #c8b08a;border-right:0;border-radius:9px 0 0 9px;display:block}
/* листок, що перегортається */
.leaf{position:absolute;left:var(--W);top:0;width:var(--W);height:var(--H);transform-origin:left center;transform-style:preserve-3d;z-index:4;pointer-events:none;transform:translateZ(2px)}

@keyframes leafN{from{transform:translateZ(2px) rotateY(0)}to{transform:translateZ(2px) rotateY(-180deg)}}

/* наліпки */
.stks{position:absolute;inset:0;pointer-events:none;z-index:2}

.stk.tape{width:calc(var(--W) * .34);opacity:.88}

.stk svg,.tray svg{display:block;width:100%;height:auto}

.tray{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:56px;width:210px;max-height:calc(100% - 140px);overflow:auto;background:rgba(255,253,250,.94);border:1px solid var(--line);padding:10px;z-index:8;box-shadow:0 18px 40px -24px rgba(60,14,24,.45)}
.tray .tt{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.tray .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:center}
.tray .it{border:0;background:none;padding:2px;cursor:grab;touch-action:none}
.tray .it.tape{grid-column:span 3}
.tray .note2{font-size:11px;color:var(--muted);margin-top:8px}
@media (max-width:700px){.tray{left:12px;right:12px;width:auto;top:auto;bottom:118px;max-height:42%}.tray .g{grid-template-columns:repeat(5,1fr)}.tray .it.tape{grid-column:span 5}}
.bui{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 12px;z-index:9}
.bui button{border:0;padding:10px 16px;border-radius:999px;background:var(--wine);color:#fff;font-size:12px;letter-spacing:.06em;font-weight:600;box-shadow:0 6px 14px -6px rgba(60,14,24,.55)}
.bui button.sec{background:var(--card);color:var(--wine);border:1px solid var(--line)}
@media (max-width:899px){.bui{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}

<div class="app">
  <aside class="side" id="side" aria-label="Меню"></aside>
  <div class="main">
    <div class="months" id="months" hidden></div>
    <main class="content gut" id="view" aria-live="polite"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Розділи"></nav>
</div>

<script>
(function(){
/* ======================= довідники ======================= */
const DAYS=['Понеділок','Вівторок','Середа','Четвер','П’ятниця','Субота','Неділя'];
const DSH=['ПН','ВТ','СР','ЧТ','ПТ','СБ','НД'];
const MON=['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'];
const MONG=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MSH=['СІЧ','ЛЮТ','БЕР','КВІ','ТРА','ЧЕР','ЛИП','СЕР','ВЕР','ЖОВ','ЛИС','ГРУ'];
const CATS=['Житло та комуналка','Продукти','Кафе та ресторани','Транспорт','Краса та догляд','Одяг','Здоров’я','Дім і побут','Зв’язок і підписки','Розваги','Подарунки','Навчання','Подорожі','Інше'];
const MOODS=[['Чудово','#eba9bf','M7 13c1.4 2 3.2 3 5 3s3.6-1 5-3'],['Добре','#f3c9d6','M8 13.5c1.2 1.3 2.6 2 4 2s2.8-.7 4-2'],['Нормально','#ecdcd0','M8 14.5h8'],['Втомлена','#c79aa3','M8 15.5c1.2-1 2.6-1.5 4-1.5s2.8.5 4 1.5'],['Сумно','#9a7179','M7 16.5c1.4-1.8 3.2-2.7 5-2.7s3.6.9 5 2.7']];
const HABITS=['Вода 2 літри','Сон 8 годин','Спорт','Читання','Без цукру','Догляд за шкірою','Прогулянка','Медитація'];
const SPHERES=['Здоров’я','Кар’єра','Фінанси','Стосунки','Саморозвиток','Подорожі','Дім','Хобі'];
const NAV=[['book','Головна'],['home','Огляд'],['day','Сьогодні'],['week','Тиждень'],['month','Місяць'],['trackers','Трекери'],['goals','Цілі'],['finance','Фінанси'],['notes','Нотатки']];
const TABBAR=[['book','Головна'],['month','Місяць'],['goals','Цілі'],['finance','Фінанси'],['notes','Нотатки']];
const TABOF={book:'book',home:'book',day:'month',week:'month',month:'month',trackers:'month',goals:'goals',finance:'finance',notes:'notes',settings:'book'};

/* ======================= дати ======================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const wd=d=>(d.getDay()+6)%7;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>addDays(d,-wd(d));
const dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const weekOfMonth=d=>Math.floor((d.getDate()-1+wd(new Date(d.getFullYear(),d.getMonth(),1)))/7)+1;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const money=n=>(Math.round(n)||0).toLocaleString('uk-UA')+' ₴';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};

/* ======================= сховище ======================= */
/* Кожен розділ — окремий документ. З акаунтом: data/users/<id>/<ключ> (бачить лише власник записів),
   інакше — у браузері. Записи відкладаються на мить і йдуть по одному на документ. */
const LKEY='plp-app-v1';
const store={docs:{},dirty:new Set(),inflight:new Set(),coll:null,mode:'loading',timer:null};
function blank(key){
  const p=key.split('-')[0];
  if(p==='day')return{sched:{},top:['','',''],tasks:[],water:0,mood:null,grat:['','',''],sleep:{bed:'',wake:'',q:0},sport:{what:'',min:''},food:{b:'',l:'',d:'',s:''},aff:'',note:''};
  if(p==='week')return{prio:['','','',''],note:''};
  if(p==='month')return{goals:[],dates:[],focus:'',newh:'',avoid:''};
  if(p==='fin')return{plan:{},exp:[],inc:[],pay:[],piggy:0,coin:500};
  if(p==='hab'){const prev=Object.keys(store.docs).filter(k=>k.startsWith('hab-')&&k<key).sort().pop();return{names:(prev?store.docs[prev].names:HABITS).slice(),marks:{}}}
  if(key==='goals'||key==='wish'||key==='notes'||key==='stickers')return{items:[]};
  if(key==='aff')return{items:['Я дозволяю собі рухатися у своєму темпі.','Я гідна всього, про що мрію.','Кожен день — це новий шанс.']};
  if(key==='settings')return{name:''};
  return{};
}
function doc(key){return store.docs[key]||(store.docs[key]=blank(key))}
function peek(key){return store.docs[key]}
function touch(key){store.dirty.add(key);status('saving');clearTimeout(store.timer);store.timer=setTimeout(flush,600)}
async function flush(){
  if(store.mode==='loading'){clearTimeout(store.timer);store.timer=setTimeout(flush,800);return}
  if(store.mode!=='cloud'){try{localStorage.setItem(LKEY,JSON.stringify(store.docs))}catch(e){}store.dirty.clear();status(store.mode);return}
  const keys=[...store.dirty];store.dirty.clear();
  for(const k of keys){
    if(store.inflight.has(k)){store.dirty.add(k);continue}
    store.inflight.add(k);
    try{await store.coll.doc(k).set(JSON.parse(JSON.stringify(store.docs[k])))}
    catch(e){
      if(e&&e.code==='unavailable'){store.dirty.add(k)}
      else if(e&&e.code==='quota_exceeded'){toast('Сховище заповнене: видали старі нотатки або витрати.')}
      else{goLocal('Не вдалося зберегти в акаунт — записи тимчасово зберігаються в цьому браузері.')}
    }finally{store.inflight.delete(k)}
  }
  if(store.dirty.size){clearTimeout(store.timer);store.timer=setTimeout(flush,1500)}else status('ok');
}
function goLocal(msg){store.mode='local';try{localStorage.setItem(LKEY,JSON.stringify(store.docs))}catch(e){}status('local');if(msg)toast(msg)}
function loadLocal(){try{const r=localStorage.getItem(LKEY);if(r)Object.assign(store.docs,JSON.parse(r))}catch(e){}}

let typing=false,pendingRender=false;
function remote(snap){
  let changed=false;
  snap.docChanges().forEach(ch=>{const k=ch.doc.id;if(store.dirty.has(k)||store.inflight.has(k))return;
    if(ch.type==='removed'){delete store.docs[k]}else{store.docs[k]=JSON.parse(JSON.stringify(ch.doc.data()))}changed=true});
  if(!snap.metadata.fromCache&&store.mode==='loading'){
    store.mode='cloud';status('ok');changed=true;
    // перший вхід з акаунтом: переносимо те, що вже було записано в цьому браузері
    if(snap.empty&&store.localCopy&&Object.keys(store.localCopy).length){Object.assign(store.docs,store.localCopy);Object.keys(store.localCopy).forEach(k=>store.dirty.add(k));flush();toast('Записи з цього браузера перенесено в акаунт.')}
    else if(store.dirty.size)flush();
  }
  if(changed){if(typing)pendingRender=true;else render()}
}
async function connect(){
  loadLocal();
  const cl=window.claude;
  let db=null,user=null;
  try{[db,user]=await Promise.all([cl?.use?cl.use('db'):null,cl?.use?cl.use('user'):null])}catch(e){}
  const id=user?await user.id():null;
  if(!db||!id){store.mode='local';status('local');render();return}
  let localCopy=store.docs;store.localCopy=localCopy;store.docs={};store.mode='loading';status('loading');
  store.coll=db.collection('data/users/'+id);
  const timer=setTimeout(()=>{if(store.mode==='loading'){store.docs=Object.keys(store.docs).length?store.docs:localCopy;store.mode='local';status('local');toast('Не вдалося дістатися до акаунта — поки що записи зберігаються в цьому браузері.');render()}},10000);
  store.coll.onSnapshot(s=>{clearTimeout(timer);remote(s)},e=>{clearTimeout(timer);store.docs=Object.keys(store.docs).length?store.docs:localCopy;goLocal('Синхронізація зупинилася — записи зберігаються в цьому браузері.');render()});
}

function resolve(ref){const i=ref.indexOf(':');return[keyOf(ref.slice(0,i)),ref.slice(i+1)]}
function getP(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,path,v){const ks=path.split('.');let x=o;for(let i=0;i<ks.length-1;i++){if(x[ks[i]]==null)x[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};x=x[ks[i]]}x[ks.at(-1)]=v}

function doBackup(){
  try{const blob=new Blob([JSON.stringify({app:'prettylittle-plans',v:1,saved:new Date().toISOString(),docs:store.docs},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`prettylittle-plans-${iso(today())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Копію збережено у файл.')}
  catch(e){toast('Не вдалося зберегти копію.')}
}
function doRestore(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d.app!=='prettylittle-plans'||!d.docs)throw 0;store.docs=d.docs;Object.keys(store.docs).forEach(k=>store.dirty.add(k));flush();render();toast('Планер відновлено з копії.')}catch(e){toast('Це не схоже на файл копії планера.')}};
  fr.readAsText(file);
}

function bookLayout(){
  const st=$('#stage');if(!st)return;
  const cw=st.clientWidth,ch=st.clientHeight,narrow=cw<700;
  const flat=!!$('#pgflat');
  let W=flat?Math.min(cw-60,(ch-260)/1.414,460):narrow?Math.min(cw-110,(ch-330)/1.414):Math.min(420,(cw-(B.tray?300:140))/2,(ch-170)/1.414);
  W=Math.max(150,Math.floor(W));
  st.style.setProperty('--W',W+'px');st.style.setProperty('--H',Math.round(W*1.414)+'px');
  st.style.setProperty('--cover','linear-gradient(135deg,#efc1cf,#e7adc0 55%,#dc9cb1)');
  if(flat)return;
  // inner: яку частину книги ставимо в центр (вона ж — центр обертання); outer: зсув усієї сцени
  const inner=!B.open?-W/2:narrow?(B.side==='right'?-W/2:W/2):0;
  const outer=(B.tray&&!narrow?-80:0)+(!B.open&&narrow?-12:0)+(B.dx||0);
  $('#scene').style.transform=`translateX(${outer}px) scale(${B.z}) rotateX(${B.rx}deg) rotateY(${B.ry}deg) translateX(${inner}px)`;
  document.querySelectorAll('.narrowonly').forEach(b=>b.hidden=!narrow);
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('#book')?.classList.remove('still')));
}

/* ======================= 3D-модель планера (WebGL, Three.js) =======================
   Модель зібрана в Blender з PDF (3d/build_planner.py → planner.glb). Поки книга закрита, замість
   CSS-обкладинки показуємо модель: її можна крутити; дотик — резинка зіскакує, обкладинка
   відкривається, камера наїжджає, і модель тихо змінюється робочим розворотом (або пласкою
   сторінкою на телефоні), де все натискається. Без WebGL лишається CSS-книга. */
const GL={ready:false,p:null,busy:false,yaw:0,pitch:0,idle:0};
const TEX_BASE='tex/'; // текстури блокнота (3d/make_web_tex.py → 3d/web/tex)

// камери в координатах glTF (Blender x,y,z → x,z,-y), ті самі, що й у рендерах
const GCAM={closed:{p:[1.85,2.15,2.55],t:[.5,.05,.15]},open:{p:[.05,2.85,2.15],t:[.05,0,.12]},flat:{p:[.5,2.75,.02],t:[.5,.07,0]}};
function glInit(){
  if(GL.p)return GL.p;
  GL.p=(async()=>{
    const THREE=await import('three');
    const [{createPlanner},{RoomEnvironment}]=await Promise.all([import('./planner3d.js'),import('three/addons/environments/RoomEnvironment.js')]);
    const R=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
    const phone=matchMedia('(pointer:coarse)').matches||innerWidth<700;
    R.setPixelRatio(Math.min(devicePixelRatio||1,phone?1.5:2));R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.NoToneMapping;
    R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
    const scene=new THREE.Scene();
    const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
    scene.add(new THREE.HemisphereLight(0xfff8f4,0xd9c4b8,.5));
    const key=new THREE.DirectionalLight(0xfff3e8,2.3);key.position.set(1.6,3.0,1.2);key.castShadow=true;
    Object.assign(key.shadow.camera,{left:-1.6,right:1.6,top:1.6,bottom:-1.6,near:.5,far:8});key.shadow.mapSize.set(phone?1024:2048,phone?1024:2048);key.shadow.radius=6;key.shadow.bias=-.0004;key.shadow.normalBias=.012;
    scene.add(key);const fill=new THREE.DirectionalLight(0xfff0f4,.35);fill.position.set(-2.6,2,1);scene.add(fill);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.ShadowMaterial({opacity:.24}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    const planner=await createPlanner(THREE,TEX_BASE,{anisotropy:Math.min(8,R.capabilities.getMaxAnisotropy()),renderer:R});
    const model=planner.root;
    model.traverse(o=>{if(o.isMesh&&o.material&&!o.material.userData.keepEnv)o.material.envMapIntensity=o.material.metalness>.5?1.3:.32});
    const spin=new THREE.Group();spin.position.set(.48,0,0);model.position.set(-.48,0,0);spin.add(model);scene.add(spin);
    const dur=1;
    const cam=new THREE.PerspectiveCamera(30,1,.05,40);
    Object.assign(GL,{THREE,R,scene,cam,spin,planner,dur,ready:true,t:0,tw:null});if(/[?&]debug3d/.test(location.search))window.__gl=GL;
    glPose(0);

    R.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();glFail('context lost')});
  })().catch(e=>glFail(e));

  setTimeout(()=>{if(!GL.ready)glFail('timeout')},20000);
  return GL.p;
}
function glFail(why){console.warn('3D-модель вимкнено:',why);GL.failed=true;GL.ready=false;GL.busy=false;$('#stage')?.classList.remove('gl');$('#gl3d')?.remove()}
function glPose(t){GL.t=t;GL.planner.setOpen(Math.max(0,Math.min(1,t)))}
const lerp=(a,b,k)=>a+(b-a)*k,ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function glCamAt(k,a,b){
  const {cam,R}=GL,c=R.domElement,w=c.clientWidth||1,h=c.clientHeight||1;
  cam.aspect=w/h;
  // кадр розрахований на 4:3; на вужчому екрані камера відʼїжджає, щоб книга вміщалась
  const back=Math.min(1.7,Math.max(1,Math.pow(1.33/cam.aspect,.5)))/(B.z||1);
  const P=a.p.map((v,i)=>lerp(v,b.p[i],k)),T=a.t.map((v,i)=>lerp(v,b.t[i],k));
  cam.position.set(...P.map((v,i)=>T[i]+(v-T[i])*back));cam.lookAt(...T);cam.updateProjectionMatrix();
}
function glSize(){const c=GL.R.domElement,p=c.parentElement;if(!p)return;const w=p.clientWidth,h=p.clientHeight;if(!w||!h)return;if(c.width!==Math.round(w*GL.R.getPixelRatio())||c.height!==Math.round(h*GL.R.getPixelRatio()))GL.R.setSize(w,h,false)}
function glLoop(now){
  GL.raf=0;if(GL.failed)return;const c=GL.R.domElement;if(!c.isConnected&&!GL.busy)return;
  glSize();
  if(GL.tw){ // анімація відкриття/закриття
    const w=GL.tw,k=Math.min(1,(now-w.t0)/w.ms);
    glPose(lerp(w.a0,w.a1,Math.min(1,k*1.15)));

    glCamAt(kc,w.c0,w.c1);GL.spin.rotation.y=lerp(w.y0,0,ease(Math.min(1,k*1.6)));GL.spin.rotation.x=lerp(w.x0,0,ease(Math.min(1,k*1.6)));

    GL.spin.rotation.y=GL.yaw+(GL.drag?0:Math.sin(GL.idle)*.07);GL.spin.rotation.x=GL.pitch;

    const b=$('#gl3d');if(!b||!GL.ready||GL.failed)return;
    if(GL.R.domElement.parentElement!==b){b.innerHTML='';b.appendChild(GL.R.domElement)}
    const st=$('#stage');
    if(GL.closing){ // з розвороту: модель зʼявляється розкритою і закривається
      GL.closing=false;glPose(GL.dur);GL.yaw=0;GL.pitch=0;
      const narrow=innerWidth<700;GL.tw={t0:performance.now(),ms:reduced()?1:2400,a0:GL.dur,a1:0,c0:narrow?GCAM.flat:GCAM.open,c1:GCAM.closed,camDelay:0,y0:0,x0:0,done:null};
    }else if(!GL.busy){glPose(0)}
    glSize();glCamAt(0,GCAM.closed,GCAM.closed);GL.R.render(GL.scene,GL.cam);
    if(GL.R.getContext().isContextLost())return glFail('no context');
    GL.shown=true;
    if(!st.classList.contains('gl')){
      const hl=st.querySelector('.hintline');if(hl)hl.textContent=innerWidth<700?'Натисни на планер, щоб відкрити':'Натисни на планер, щоб відкрити · тягни, щоб повернути, колесо — наблизити';
      requestAnimationFrame(()=>st.classList.add('gl'));
    }

  });
}
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function glDown(e){
  if(GL.busy)return;e.preventDefault();
  GL.yaw+=Math.sin(GL.idle)*.07;GL.idle=0; // поточне погойдування стає частиною повороту
  const d={x0:e.clientX,y0:e.clientY,yaw:GL.yaw,pitch:GL.pitch,moved:false};GL.drag=d;
  const mv=ev=>{const dx=ev.clientX-d.x0,dy=ev.clientY-d.y0;if(Math.abs(dx)+Math.abs(dy)>6)d.moved=true;if(!d.moved)return;
    GL.yaw=Math.max(-1.1,Math.min(1.1,d.yaw+dx*.008));GL.pitch=Math.max(-.25,Math.min(.35,d.pitch+dy*.004))};

function glOpen(){

  GL.tw={t0:performance.now(),ms:reduced()?1:3000,a0:0,a1:GL.dur,c0:GCAM.closed,c1:narrow?GCAM.flat:GCAM.open,camDelay:.12,

      GL.R.render(GL.scene,GL.cam);
      const img=new Image();img.src=c.toDataURL('image/png');img.className='glfade';
      img.style.cssText=`left:${r.left-sr.left}px;top:${r.top-sr.top}px;width:${r.width}px;height:${r.height}px`;

    if(ds.delhab!=null){const h=doc(keyOf('hab')),i=+ds.delhab;h.names.splice(i,1);const nm={};Object.entries(h.marks).forEach(([kk,v])=>{const[a,d]=kk.split('|').map(Number);if(a<i)nm[kk]=v;else if(a>i)nm[(a-1)+'|'+d]=v});h.marks=nm;touch(keyOf('hab'));rerender();return}

  if(ds.msub){if(ds.msub==='trk')return go('trackers');if(ds.msub==='fin')return go('finance');sub.month=ds.msub;return rerender()}
  if(ds.gsub){sub.goals=ds.gsub;return rerender()}
  if(ds.fsub){sub.finance=ds.fsub;return ds.go?go(ds.go):render()}

  if(ds.star){const d=doc(keyOf('day')),n=+ds.star;d.sleep.q=d.sleep.q===n?n-1:n;touch(keyOf('day'));return rerender()}
  if(ds.coin){const f=doc(keyOf('fin')),n=+ds.coin;f.piggy=f.piggy===n?n-1:n;touch(keyOf('fin'));return rerender()}
  if(ds.hab){const h=doc(keyOf('hab'));h.marks[ds.hab]?delete h.marks[ds.hab]:h.marks[ds.hab]=1;touch(keyOf('hab'));return rerender()}
  if(ds.newnote!=null){const n={id:uid(),title:'',body:'',upd:Date.now()};doc('notes').items.push(n);touch('notes');noteOpen=n.id;render();$('.editor .title')?.focus();return}

    case 'goal':if(!fd.title?.trim())return;item={id:uid(),title:fd.title.trim(),sphere:fd.sphere,until:fd.until||'',why:'',steps:[]};break;
    case 'wish':if(!fd.title?.trim())return;item={id:uid(),list:f.dataset.list,title:fd.title.trim(),price:(fd.price||'').replace(/\D/g,''),done:false};break;
    case 'exp':{const a=parseFloat(String(fd.amt).replace(',','.').replace(/\s/g,''));if(!fd.what?.trim()||!(a>0)){toast('Вкажи, на що витрата, і суму більше нуля.');return}item={what:fd.what.trim(),amt:a,cat:fd.cat,date:fd.date||iso(today())};break}
    case 'inc':if(!fd.src?.trim())return;item={src:fd.src.trim(),amt:(fd.amt||'').replace(/\D/g,'')};break;
    case 'pay':if(!fd.name?.trim())return;item={name:fd.name.trim(),amt:(fd.amt||'').replace(/\D/g,''),done:false};break;
  }
  arr.push(item);touch(k);rerender();
  const again=document.querySelector(`form[data-add="${CSS.escape(ref)}"]${f.dataset.list?`[data-list="${f.dataset.list}"]`:''} input`);if(again&&f.dataset.tpl!=='goal'&&f.dataset.tpl!=='exp')again.focus();
});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==view){view=v;render()}});
addEventListener('beforeunload',()=>{if(store.dirty.size)flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&store.dirty.size){clearTimeout(store.timer);flush()}});

render();
connect();
})();
</script>
</body>
</html>
